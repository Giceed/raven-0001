<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Raven Studio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1117;--line:#273142;--text:#f5f7fb;--muted:#8b98aa;--purple:#8b5cf6;--cyan:#06b6d4;--orange:#f97316;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{padding:12px 16px;border-bottom:1px solid var(--line);background:#090c12;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:1000;letter-spacing:1.4px}.brand span{color:#c4b5fd}.toolbar{display:flex;gap:8px;flex:1;flex-wrap:wrap}.search{min-width:220px;flex:1}.top input,.top button,.top select,.editor input,.editor select,.editor button{border:1px solid var(--line);border-radius:9px;background:#111722;color:var(--text);padding:9px 11px}.top button,.editor button{cursor:pointer;font-weight:800}.primary{background:#6d28d9!important;border-color:#a78bfa!important}.good{background:#14532d!important;border-color:#22c55e!important}.bad{background:#451a1a!important;border-color:#ef4444!important}.layout{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px}.map-wrap{position:relative;min-height:400px}#map{height:100%;width:100%;background:#0a0d12}.legend{position:absolute;z-index:800;left:12px;bottom:12px;background:#0d1117e8;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px;line-height:1.7}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.side{min-height:0;border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto 1fr}.status{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.stats{display:flex;gap:12px;margin-top:7px;color:var(--text);font-weight:800}.editor{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:9px}.editor[hidden]{display:none}.editor h2{font-size:18px;margin:0}.meta{font-size:11px;color:var(--muted);line-height:1.5}.field{display:grid;grid-template-columns:95px 1fr;align-items:center;gap:8px;font-size:12px}.range-row{display:grid;grid-template-columns:1fr 78px;gap:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.list{overflow:auto;padding:8px}.candidate{width:100%;text-align:left;margin-bottom:7px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0a0e14;color:var(--text);cursor:pointer}.candidate:hover,.candidate.selected{border-color:#a78bfa}.candidate.approved{border-color:#166534;background:#052e161f}.candidate.rejected{opacity:.45}.candidate-name{font-weight:850;font-size:12px}.candidate-sub{font-size:10px;color:var(--muted);margin-top:4px}.marker{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:3px solid white;background:var(--cyan);box-shadow:0 0 0 6px #22d3ee4d,0 0 20px #22d3ee;color:white;font-weight:950}.marker.activity{background:var(--orange);box-shadow:0 0 0 6px #fb923c4d,0 0 20px #fb923c}.marker.approved{background:#15803d;box-shadow:none}.marker.rejected{background:#4b5563;box-shadow:none;opacity:.45}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr;grid-template-rows:58vh auto}.side{border-left:0;border-top:1px solid var(--line);min-height:500px}}
.app{grid-template-rows:auto auto auto 1fr}.type-guide{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:8px;padding:10px 12px;background:#0d1117;border-bottom:1px solid var(--line)}.type-guide button{border:1px solid var(--line);border-radius:10px;background:#111722;color:#fff;padding:10px;text-align:left;cursor:pointer}.type-guide button strong,.type-guide button small{display:block}.type-guide button small{color:var(--muted);font-size:10px;margin-top:4px}.type-guide button.active{border-color:#a78bfa;box-shadow:0 0 12px #7c3aed66}.type-guide .activity.active{border-color:#fb923c;box-shadow:0 0 12px #f9731666}.filters{display:flex;gap:7px;padding:9px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:#0b0f16}.filters button,.filters input,.filters select{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#111722;color:var(--muted);padding:7px 11px;font-size:11px;font-weight:800}.filters button{cursor:pointer}.filters button.active{background:#6d28d9;color:white;border-color:#a78bfa}.filters input{min-width:190px;border-radius:9px;color:var(--text)}
.place-search-wrap{position:relative;min-width:240px;flex:1}.place-search-wrap .search{width:100%}.place-suggestions{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:5000;background:#111722;border:1px solid #374151;border-radius:10px;overflow:hidden;box-shadow:0 14px 35px #000b}.place-suggestions.open{display:block}.place-suggestions button{display:block;width:100%;text-align:left;border:0!important;border-bottom:1px solid #273142!important;border-radius:0!important;background:#111722!important;color:#f8fafc!important;padding:10px 12px!important}.place-suggestions button:hover{background:#312e81!important}
@media(max-width:700px){.type-guide{grid-template-columns:1fr}.type-guide button{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">🐦‍⬛ <span>RAVEN STUDIO</span> V1</div>
    <div class="toolbar">
      <strong>📍 Testgebiet: Fürstenberg</strong>
      <button id="studioGodViewButton" onclick="toggleStudioGodView()">👁 GOD VIEW</button>
      <select id="searchRadius" title="Suchradius"><option value="1500">1,5 km</option><option value="3000" selected>3 km</option><option value="5000">5 km</option><option value="10000">10 km</option></select>
      <button class="primary" onclick="loadCandidates()">OSM-Punkte laden</button>
      <button class="primary" onclick="exportProject()">🔄 Für Spiel exportieren</button>
      <button onclick="document.getElementById('importFile').click()">⬆ Import</button>
      <input id="importFile" type="file" accept="application/json" hidden onchange="importProject(event)">
    </div>
  </header>
  <section class="type-guide">
    <button class="type-filter active" data-point-type onclick="setPointTypeFilter('all',this)"><strong>Alle Punkte</strong><small>Zeigt beide Arten gemeinsam.</small></button>
    <button class="type-filter exploration" data-point-type onclick="setPointTypeFilter('exploration',this)"><strong>🟣 Erkundungspunkte</strong><small>Orte zum Entdecken, z. B. Schloss, Kirche oder Denkmal.</small></button>
    <button class="type-filter activity" data-point-type onclick="setPointTypeFilter('activity',this)"><strong>🟠 Aktivitätspunkte</strong><small>Orte zum Benutzen oder Spielen, z. B. Spielplatz, Sportplatz oder Brunnen.</small></button>
  </section>
  <nav class="filters" id="filters">
    <button class="active" data-poi-group onclick="setPoiFilter('all',this)">Alle Kategorien</button><button data-poi-group onclick="setPoiFilter('fountain',this)">⛲ Brunnen</button><button data-poi-group onclick="setPoiFilter('play',this)">🛝 Spielplätze</button><button data-poi-group onclick="setPoiFilter('sport',this)">⚽ Sport</button><button data-poi-group onclick="setPoiFilter('services',this)">🚒 Feuerwehr & Polizei</button><button data-poi-group onclick="setPoiFilter('education',this)">🏫 Schulen & Kitas</button><button data-poi-group onclick="setPoiFilter('rail',this)">🚉 Bahnhöfe</button><button data-poi-group onclick="setPoiFilter('airport',this)">✈ Flughäfen</button><button data-poi-group onclick="setPoiFilter('culture',this)">🏰 Kultur</button><button data-poi-group onclick="setPoiFilter('nature',this)">🥾 Natur</button><input id="pointSearch" placeholder="Punktname filtern …" oninput="applyPoiFilters()">
  </nav>
  <main class="layout">
    <section class="map-wrap">
      <div id="map"></div>
      <div class="legend"><div><i class="dot" style="background:#06b6d4"></i>Erkundung</div><div><i class="dot" style="background:#f97316"></i>Aktivität</div><div><i class="dot" style="background:#22c55e"></i>Behalten</div></div>
    </section>
    <aside class="side">
      <div class="status"><div id="status">Bereit. Ort suchen oder OSM-Punkte laden.</div><div class="stats"><span id="pending">0 zu prüfen</span><span id="approved">0 behalten</span><span id="rejected">0 gelöscht</span></div></div>
      <section class="editor" id="editor" hidden>
        <h2 id="editName"></h2><div class="meta" id="editMeta"></div>
        <label class="field"><span>Kategorie</span><select id="editCategory" onchange="updateSelected()"><option value="exploration">Erkundung</option><option value="activity">Aktivität</option></select></label>
        <label class="field"><span>Radius</span><div class="range-row"><input id="editRadiusRange" type="range" min="15" max="1000" step="5" oninput="syncRadius(this.value)"><input id="editRadius" type="number" min="15" max="1000" step="5" onchange="syncRadius(this.value)"></div></label>
        <div class="actions"><button onclick="startMove()">📍 Verschieben</button><button onclick="setStatusForSelected('pending')">↺ Offen</button><button class="good" onclick="setStatusForSelected('approved')">✓ Behalten</button><button class="bad" onclick="setStatusForSelected('rejected')">✕ Löschen</button></div>
      </section>
      <div class="list" id="candidateList"><div class="empty">Noch keine Kandidaten geladen.</div></div>
    </aside>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORAGE_KEY="ravenStudioV1";
/* Bewusst kleiner Prototyp-Ausschnitt: nur Fürstenberg und direkte Randwege. */
const BAD_WUENNENBERG_BOUNDS=L.latLngBounds([51.492,8.713],[51.538,8.774]);
const map=L.map("map",{preferCanvas:true,minZoom:11,maxBounds:BAD_WUENNENBERG_BOUNDS,maxBoundsViscosity:1}).setView([51.5157,8.741],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,noWrap:true,bounds:BAD_WUENNENBERG_BOUNDS.pad(.15),keepBuffer:2,attribution:"© OpenStreetMap"}).addTo(map);
map.createPane("territoryMaskPane");map.getPane("territoryMaskPane").style.zIndex="650";map.getPane("territoryMaskPane").style.pointerEvents="none";
function joinBoundaryLines(lines){const rest=lines.map(line=>line.map(point=>[point[0],point[1]])),ring=rest.shift()||[],key=point=>point[0].toFixed(6)+","+point[1].toFixed(6);while(rest.length){const end=key(ring[ring.length-1]),index=rest.findIndex(line=>key(line[0])===end||key(line[line.length-1])===end);if(index<0)break;let next=rest.splice(index,1)[0];if(key(next[next.length-1])===end)next.reverse();ring.push(...next.slice(1));}if(ring.length&&key(ring[0])!==key(ring[ring.length-1]))ring.push(ring[0]);return ring;}
async function cutMapToBadWuennenberg(){const south=51.492,west=8.713,north=51.538,east=8.774,ring=[[south,west],[south,east],[north,east],[north,west],[south,west]],outside=[[-85,-180],[-85,180],[85,180],[85,-180],[-85,-180]];L.polygon([outside,ring],{pane:"territoryMaskPane",stroke:false,fillColor:"#05070b",fillOpacity:1,fillRule:"evenodd",interactive:false}).addTo(map);L.polyline(ring,{color:"#a855f7",weight:3,opacity:.9,dashArray:"8 6",interactive:false}).addTo(map);map.fitBounds(ring,{padding:[14,14]});}
cutMapToBadWuennenberg();
const state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||{center:{lat:51.5157,lon:8.741,name:"Fürstenberg, Bad Wünnenberg"},candidates:[]};
let markers=new Map(),markerLayer=L.layerGroup().addTo(map),selectedId=null,radiusCircle=null,moveId=null;
let activePoiGroup="all";
let activePointType="all";
const TEST_CENTER={lat:51.5157,lon:8.741,radius:100000};
let placeSuggestTimer=null,placeSuggestionRows=[];
let selectedGeojson=null,selectedAreaLayer=null;
const BAD_WUENNENBERG_PLACES=["Bad Wünnenberg","Bleiwäsche","Elisenhof","Fürstenberg","Haaren","Helmern","Leiberg"];

function renderLocalPlaceSuggestions(value){
  const query=value.trim().toLocaleLowerCase("de");
  const matches=BAD_WUENNENBERG_PLACES.filter(name=>
    !query || name.toLocaleLowerCase("de").startsWith(query)
  );
  const box=document.getElementById("placeSuggestions");
  box.innerHTML=matches.map(name=>`<button type="button" onclick="chooseLocalPlace('${name}')">📍 ${name}</button>`).join("");
  box.classList.toggle("open",matches.length>0&&document.activeElement===document.getElementById("placeSearch"));
}

function chooseLocalPlace(name){
  document.getElementById("placeSearch").value=name;
  document.getElementById("placeSuggestions").classList.remove("open");
  searchPlace();
}

function showWholeCity(){
  selectedGeojson=null;
  if(selectedAreaLayer){map.removeLayer(selectedAreaLayer);selectedAreaLayer=null;}
  document.getElementById("placeSearch").value="";
  map.fitBounds(BAD_WUENNENBERG_BOUNDS,{padding:[25,25]});
  applyPoiFilters();
  setMessage("Gesamtes Stadtgebiet Bad Wünnenberg mit allen Ortsteilen.");
}

let studioGodViewLayer=null;
async function toggleStudioGodView(){
  const button=document.getElementById("studioGodViewButton");
  if(studioGodViewLayer){map.removeLayer(studioGodViewLayer);studioGodViewLayer=null;button.classList.remove("primary");setMessage("God View ausgeschaltet.");return;}
  try{
    const response=await fetch("../data/bad-wuennenberg-boundaries.json?v=3"),data=await response.json();
    studioGodViewLayer=L.layerGroup().addTo(map);
    data.features.forEach(feature=>feature.lines.forEach(line=>{
      const visible=line.filter(point=>BAD_WUENNENBERG_BOUNDS.contains(point));
      if(visible.length<2)return;
      L.polyline(visible,{color:feature.level===8?"#facc15":"#c084fc",weight:feature.level===8?5:4,opacity:.98,dashArray:feature.level===8?null:"8 6",interactive:false}).addTo(studioGodViewLayer);
    }));
    button.classList.add("primary");showWholeCity();setMessage("God View aktiv – Stadtgrenze gelb, Ortsteile lila.");
  }catch(error){setMessage("God View konnte nicht geladen werden.");}
}
const endpoints=["https://overpass.kumi.systems/api/interpreter","https://overpass-api.de/api/interpreter"];

const ravenBasePoints=[
  {id:"raven-schloss",name:"Schloss Fürstenberg",lat:51.5155802,lon:8.7367807,rawType:"castle",category:"exploration",radius:160,score:100,access:"Außenradius / öffentliche Wege",status:"approved",source:"Raven-Karte"},
  {id:"raven-st-marien",name:"St. Marien / Sintfeld-Dom",lat:51.5157079,lon:8.7397917,rawType:"place_of_worship",category:"exploration",radius:50,score:100,access:"öffentliches Umfeld",status:"approved",source:"Raven-Karte"},
  {id:"raven-rathaus",name:"Rathaus",lat:51.5164455,lon:8.7449286,rawType:"townhall",category:"exploration",radius:50,score:100,access:"öffentlicher Straßenraum",status:"approved",source:"Raven-Karte"},
  {id:"raven-beerenstelle",name:"Beerenstelle",lat:51.51325,lon:8.74215,rawType:"foraging",category:"activity",radius:35,score:100,access:"draußen",status:"approved",source:"Raven-Karte"},
  {id:"raven-spielplatz",name:"Spielplatz",lat:51.51845,lon:8.74730,rawType:"playground",category:"activity",radius:35,score:100,access:"draußen",status:"approved",source:"Raven-Karte"}
];

function mergeRavenBasePoints(){
  const existing=new Set(state.candidates.map(candidate=>candidate.id));
  ravenBasePoints.forEach(point=>{
    if(!existing.has(point.id)) state.candidates.unshift({...point});
  });
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

async function mergeCityPoiCatalog(){
  try{
    const response=await fetch("../data/bad-wuennenberg-pois.json?v=1");
    if(!response.ok)throw new Error();
    const catalog=await response.json();
    const previous=new Map(state.candidates.map(candidate=>[candidate.id,candidate]));
    catalog.points.forEach(point=>{
      const saved=previous.get(point.id);
      if(saved)Object.assign(saved,{...point,status:saved.status,lat:saved.lat,lon:saved.lon,radius:saved.radius,category:saved.category});
      else state.candidates.push(point);
    });
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    return catalog.points.length;
  }catch(error){setMessage("Der Bad-Wünnenberg-Punktkatalog konnte nicht geladen werden.");return 0;}
}

function esc(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderStats();renderList();}
function setMessage(text){document.getElementById("status").textContent=text;}
function renderStats(){const count=s=>state.candidates.filter(c=>c.status===s).length;pending.textContent=count("pending")+" zu prüfen";approved.textContent=count("approved")+" behalten";rejected.textContent=count("rejected")+" gelöscht";}

async function searchPlace(){
  const query=placeSearch.value.trim();if(!BAD_WUENNENBERG_PLACES.includes(query)){setMessage("Bitte einen Ortsteil der Stadt Bad Wünnenberg auswählen.");return;}
  setMessage("Ort wird gesucht …");
  try{const fullQuery=query==="Bad Wünnenberg"?"Bad Wünnenberg, Kreis Paderborn, Deutschland":`${query}, Bad Wünnenberg, Deutschland`;const response=await fetch("https://nominatim.openstreetmap.org/search?format=json&polygon_geojson=1&addressdetails=1&limit=1&q="+encodeURIComponent(fullQuery));const rows=await response.json();if(!rows.length)throw Error();const row=rows[0],found={lat:+row.lat,lon:+row.lon,name:query};state.center=found;selectedGeojson=["Polygon","MultiPolygon"].includes(row.geojson?.type)?row.geojson:null;if(selectedAreaLayer){map.removeLayer(selectedAreaLayer);selectedAreaLayer=null;}if(selectedGeojson){selectedAreaLayer=L.geoJSON(selectedGeojson,{style:{color:"#facc15",weight:4,opacity:.95,fillColor:"#facc15",fillOpacity:.05}}).addTo(map);map.fitBounds(selectedAreaLayer.getBounds(),{padding:[35,35],maxZoom:15});}else map.setView([state.center.lat,state.center.lon],14);save();applyPoiFilters();setMessage("Gebiet gewählt: "+query);}catch(e){setMessage("Ort konnte gerade nicht gefunden werden.");}
}

function suggestPlaces(value){
  clearTimeout(placeSuggestTimer);
  const query=value.trim();
  if(query.length<1)return;
  placeSuggestTimer=setTimeout(async()=>{
    try{
      const box="7.28,52.42,10.20,50.61";
      const response=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=10&countrycodes=de&bounded=1&viewbox=${box}&q=${encodeURIComponent(query)}`);
      placeSuggestionRows=(await response.json()).filter(row=>distanceMeters(+row.lat,+row.lon,TEST_CENTER.lat,TEST_CENTER.lon)<=TEST_CENTER.radius);
      document.getElementById("placeSuggestions").innerHTML=placeSuggestionRows.map(row=>`<option value="${esc(row.display_name)}"></option>`).join("");
    }catch(e){}
  },280);
}

async function loadCandidates(){
  const radius=+searchRadius.value;setMessage("OSM-Kandidaten werden geladen …");
  const q=`[out:json][timeout:25];(
    nwr(around:${radius},${state.center.lat},${state.center.lon})[tourism][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[historic][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[amenity][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[leisure][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[amenity=fountain];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[amenity=fire_station];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[amenity=school];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[amenity=kindergarten];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[leisure=playground];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[leisure=park];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[leisure=pitch];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[leisure=sports_centre];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[railway=station];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[railway=halt];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[public_transport=station][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[aeroway=aerodrome][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[aeroway=terminal];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[amenity=post_office];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[tourism=information];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[highway=trailhead];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[man_made=tower][name];
    nwr(around:${radius},${state.center.lat},${state.center.lon})[man_made=water_tower][name];
  );out center tags;`;
  let data=null;
  for(const endpoint of endpoints){try{const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:"data="+encodeURIComponent(q)});if(response.ok){data=await response.json();break;}}catch(e){}}
  if(!data){setMessage("OSM-Server nicht erreichbar. Bitte später erneut versuchen.");return;}
  const previous=new Map(state.candidates.map(c=>[c.id,c]));
  const ravenPoints=state.candidates.filter(c=>c.source==="Raven-Karte");
  const osmPoints=data.elements.map(makeCandidate).filter(Boolean)
    .map(c=>previous.has(c.id)?{...c,...previous.get(c.id)}:c)
    .filter(c=>!ravenPoints.some(r=>Math.hypot(r.lat-c.lat,r.lon-c.lon)<0.00035))
    .sort((a,b)=>b.score-a.score).slice(0,120);
  state.candidates=[...ravenPoints,...osmPoints];
  save();renderMarkers();fitAll();setMessage(state.candidates.length+" geeignete Vorschläge geladen.");
}

function makeCandidate(e){
  const t=e.tags||{},lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;if(["private","no"].includes(t.access)||t.foot==="no")return null;
  const raw=t.historic||t.tourism||t.leisure||t.amenity||t.railway||t.aeroway||t.man_made||(t.highway==="trailhead"?"trailhead":null)||(t.public_transport==="station"?"station":null)||"poi";
  if(["grave_yard","cemetery","funeral_hall","crematorium"].includes(raw)||t.landuse==="cemetery")return null;
  const activities=["playground","park","sports_centre","pitch","fitness_station","picnic_site","swimming_pool","fountain","trailhead"];
  const explorations=["castle","manor","memorial","monument","archaeological_site","attraction","viewpoint","museum","artwork","place_of_worship","townhall","library","community_centre","fire_station","police","school","kindergarten","station","halt","aerodrome","terminal","post_office","information","tower","water_tower"];
  if(!activities.includes(raw)&&!explorations.includes(raw))return null;
  const category=activities.includes(raw)?"activity":"exploration";let score=40;if(t.wikidata||t.wikipedia)score+=25;if(t.historic||t.tourism)score+=15;if(t.access==="yes"||t.foot==="yes")score+=10;
  const radius=raw==="aerodrome"?500:raw==="terminal"?120:["school","kindergarten"].includes(raw)?120:["castle","manor","archaeological_site"].includes(raw)?140:["fire_station","police","tower","water_tower"].includes(raw)?90:["place_of_worship","townhall","museum","station","halt","post_office","information"].includes(raw)?60:["pitch","sports_centre","trailhead"].includes(raw)?45:35;
  const fallbackNames={fountain:"Brunnen",playground:"Spielplatz",park:"Park",pitch:"Sportplatz",sports_centre:"Sportanlage",fire_station:"Feuerwehr",school:"Schule",kindergarten:"Kindergarten",station:"Bahnhof",halt:"Haltepunkt",aerodrome:"Flughafen",terminal:"Flughafen-Terminal",post_office:"Poststelle",information:"Information",trailhead:"Wanderstartpunkt",tower:"Aussichtsturm",water_tower:"Wasserturm"};
  const access=["school","kindergarten","fire_station","police","tower","water_tower"].includes(raw)?"Nur Außenradius – Gelände nicht betreten":["station","halt"].includes(raw)?"Nur öffentliche Bahnhofsbereiche – Gleise nicht betreten":["aerodrome","terminal"].includes(raw)?"Nur öffentliche Bereiche – keine Rollfelder oder Betriebsflächen":t.access||t.foot||"unbekannt";
  return{id:`osm-${e.type}-${e.id}`,name:t.name||fallbackNames[raw]||"Unbenannter Punkt",lat,lon,rawType:raw,category,radius,score,access,status:"pending",osmType:e.type,osmId:e.id,source:"OpenStreetMap"};
}

function matchesPoiFilter(c){if(c.status==="rejected"||(c.district&&c.district!=="Fürstenberg")||!BAD_WUENNENBERG_BOUNDS.contains([c.lat,c.lon]))return false;const groups={fountain:["fountain","foraging"],play:["playground"],sport:["sports_centre","pitch","fitness_station","swimming_pool"],services:["fire_station","police"],education:["school","kindergarten"],rail:["station","halt"],airport:["aerodrome","terminal"],culture:["castle","manor","memorial","monument","archaeological_site","attraction","museum","artwork","place_of_worship","townhall","library","community_centre","post_office","information","tower","water_tower"],nature:["park","picnic_site","trailhead","viewpoint"]};const typeOk=activePointType==="all"||c.category===activePointType;const groupOk=activePoiGroup==="all"||(groups[activePoiGroup]||[]).includes(c.rawType);const text=(document.getElementById("pointSearch")?.value||"").trim().toLowerCase();const areaOk=!selectedGeojson||pointInGeojson(c.lat,c.lon,selectedGeojson);return typeOk&&groupOk&&areaOk&&(!text||c.name.toLowerCase().includes(text));}
function setPointTypeFilter(type,button){activePointType=type;document.querySelectorAll("[data-point-type]").forEach(b=>b.classList.remove("active"));button.classList.add("active");applyPoiFilters();setMessage(type==="exploration"?"Nur Erkundungspunkte werden angezeigt.":type==="activity"?"Nur Aktivitätspunkte werden angezeigt.":"Alle Punktarten werden angezeigt.");}
function setPoiFilter(group,button){activePoiGroup=group;document.querySelectorAll("[data-poi-group]").forEach(b=>b.classList.remove("active"));button.classList.add("active");applyPoiFilters();}
function applyPoiFilters(){renderMarkers();renderList();}
function renderMarkers(){markerLayer.clearLayers();markers.clear();state.candidates.forEach((c,i)=>{if(!matchesPoiFilter(c))return;const icon=L.divIcon({className:"",html:`<div class="marker ${c.category} ${c.status}">${i+1}</div>`,iconSize:[34,34],iconAnchor:[17,17]});const marker=L.marker([c.lat,c.lon],{icon}).addTo(markerLayer).on("click",()=>selectCandidate(c.id));markers.set(c.id,marker);});}
function renderList(){const list=document.getElementById("candidateList"),visible=state.candidates.filter(matchesPoiFilter);if(!visible.length){list.innerHTML='<div class="empty">Keine passenden Punkte in diesem Filter.</div>';return;}list.innerHTML=visible.map(c=>{const i=state.candidates.indexOf(c);return `<button class="candidate ${c.status} ${c.id===selectedId?'selected':''}" onclick="selectCandidate('${c.id}')"><div class="candidate-name">${i+1}. ${esc(c.name)}</div><div class="candidate-sub">${esc(c.district||'Fürstenberg')} · ${c.category==='activity'?'Aktivität':'Erkundung'} · ${esc(c.rawType)} · ${c.radius} m · ${c.status}</div></button>`}).join("");}
function selectCandidate(id){const c=state.candidates.find(x=>x.id===id);if(!c)return;selectedId=id;editor.hidden=false;editName.textContent=c.name;editMeta.textContent=`${c.source||"OpenStreetMap"}${c.osmType?` · OSM ${c.osmType} ${c.osmId}`:""} · ${c.rawType} · Bewertung ${c.score}/100 · Zugang ${c.access}`;editCategory.value=c.category;editRadius.value=c.radius;editRadiusRange.value=c.radius;showRadius(c);renderList();map.panTo([c.lat,c.lon]);}
function showRadius(c){if(radiusCircle)map.removeLayer(radiusCircle);radiusCircle=L.circle([c.lat,c.lon],{radius:c.radius,color:c.category==="activity"?"#f97316":"#8b5cf6",weight:3,fillOpacity:.18,dashArray:"8 5"}).addTo(map);radiusCircle.bringToBack();}
function syncRadius(value){const c=current();if(!c)return;c.radius=Math.max(15,Math.min(1000,+value||15));editRadius.value=c.radius;editRadiusRange.value=c.radius;showRadius(c);save();}
function updateSelected(){const c=current();if(!c)return;c.category=editCategory.value;showRadius(c);save();renderMarkers();}
function setStatusForSelected(status){const c=current();if(!c)return;c.status=status;if(status==="rejected"){const deletedName=c.name;selectedId=null;moveId=null;if(radiusCircle){map.removeLayer(radiusCircle);radiusCircle=null;}editor.hidden=true;save();renderMarkers();setMessage(`„${deletedName}“ wurde gelöscht und wird nicht ins Spiel übernommen.`);return;}save();renderMarkers();selectCandidate(c.id);setMessage(status==="approved"?`„${c.name}“ wird behalten.`:`„${c.name}“ ist wieder offen.`);}
function current(){return state.candidates.find(c=>c.id===selectedId);}
function startMove(){const c=current();if(!c)return;moveId=c.id;setMessage("Auf die neue Kartenposition für „"+c.name+"“ klicken.");}
map.on("click",e=>{if(!moveId)return;const c=state.candidates.find(x=>x.id===moveId);c.lat=e.latlng.lat;c.lon=e.latlng.lng;moveId=null;save();renderMarkers();selectCandidate(c.id);setMessage("Punkt verschoben.");});
function fitAll(){const visible=state.candidates.filter(c=>c.status!=="rejected");if(visible.length)map.fitBounds(visible.map(c=>[c.lat,c.lon]),{padding:[35,35],maxZoom:16});}

function distanceMeters(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)*p/2);return Math.sqrt(x*x+y*y)*R;}
function pointInGeojson(lat,lon,geojson){const polygons=geojson.type==="Polygon"?[geojson.coordinates]:geojson.coordinates;return polygons.some(polygon=>polygon.some(ring=>{let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))inside=!inside;}return inside;}));}
const boundaryLayer=L.layerGroup().addTo(map);
let boundaryData=null,selectedBoundary=null,selectedBoundaryLayer=null,boundaryTimer=null;

async function ensureBoundaries(){
  if(boundaryData)return boundaryData;
  const manifest=await fetch("../data/boundaries/manifest.json").then(r=>r.json());
  const parts=await Promise.all(manifest.files.map(file=>fetch("../data/boundaries/"+file).then(r=>r.text())));
  const bytes=Uint8Array.from(atob(parts.join("")),char=>char.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  boundaryData=await new Response(stream).json();
  boundaryData.features.forEach((feature,index)=>feature.studioId=String(index));
  populateAreaSelector();
  return boundaryData;
}

function populateAreaSelector(){
  const select=document.getElementById("areaSelect");
  if(!boundaryData){select.innerHTML='<option value="">Grenzen werden geladen …</option>';return;}
  const level=document.getElementById("areaType").value;
  const features=boundaryData.features.filter(f=>level==="all"||String(f.level)===level).sort((a,b)=>a.name.localeCompare(b.name,"de"));
  select.innerHTML='<option value="">Gebiet auswählen …</option>'+features.map(f=>`<option value="${f.studioId}">${esc(f.name)} · ${f.level===8?'Stadt/Gemeinde':f.level===9?'Stadtbezirk':'Ortsteil'}</option>`).join("");
}

function selectBoundaryArea(){
  const id=document.getElementById("areaSelect").value;
  selectedBoundary=id===""?null:boundaryData.features.find(f=>f.studioId===id);
  if(selectedBoundaryLayer){map.removeLayer(selectedBoundaryLayer);selectedBoundaryLayer=null;}
  if(selectedBoundary){
    selectedBoundaryLayer=L.layerGroup().addTo(map);
    selectedBoundary.lines.forEach(line=>L.polyline(line,{color:"#facc15",weight:5,opacity:.95,interactive:false}).addTo(selectedBoundaryLayer));
    const points=selectedBoundary.lines.flat();if(points.length)map.fitBounds(points,{padding:[35,35],maxZoom:15});
    setMessage(`${selectedBoundary.name} ausgewählt – nur Punkte innerhalb dieser Grenze.`);
  }else setMessage("Alle Gebiete im 100-km-Testkreis.");
  applyPoiFilters();
}

function pointInBoundary(lat,lon,feature){
  return feature.lines.some(line=>{let inside=false;for(let i=0,j=line.length-1;i<line.length;j=i++){const yi=line[i][0],xi=line[i][1],yj=line[j][0],xj=line[j][1];if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))inside=!inside;}return inside;});
}

async function renderBoundaries(){
  try{await ensureBoundaries();boundaryLayer.clearLayers();}
  catch(e){setMessage("Ortsgrenzen konnten gerade nicht geladen werden.");}
}

function exportProject(){const payload={format:"raven-shared-pois",version:2,exportedAt:new Date().toISOString(),center:state.center,points:state.candidates};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="raven-shared-pois.json";a.click();URL.revokeObjectURL(url);setMessage("Gemeinsame Punktedatei erstellt – schick sie jetzt im Karten-Chat an Codex.");}
async function importProject(event){try{const data=JSON.parse(await event.target.files[0].text()),points=data.points||data.candidates;if(!Array.isArray(points))throw Error();state.center=data.center||state.center;state.candidates=points;save();renderMarkers();fitAll();setMessage("Gemeinsame Punktedatei importiert.");}catch(e){setMessage("Diese Datei ist keine gültige Raven-Punktedatei.");}event.target.value="";}

async function initializeStudio(){mergeRavenBasePoints();const loaded=await mergeCityPoiCatalog();state.center={lat:51.5157,lon:8.741,name:"Fürstenberg"};renderStats();renderList();renderMarkers();setMessage(`${loaded} Punkte geladen – angezeigt wird nur das Testgebiet Fürstenberg.`);}
initializeStudio();
</script>
