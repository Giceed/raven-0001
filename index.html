<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAVEN #0001</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1c2430 0%, #0d1117 45%, #050608 100%);
      color: white;
      display: flex;
      justify-content: center;
      padding: 24px 14px 50px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 13px;
      letter-spacing: 4px;
      color: #8b949e;
    }

    .online {
      color: #56d364;
      font-size: 12px;
    }

    .card {
      background: rgba(22,27,34,.94);
      border: 1px solid #30363d;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    .raven {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      background: linear-gradient(145deg,#242c36,#090b0e);
      border: 1px solid #3b4652;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .generation {
      text-align: center;
      color: #8b949e;
      margin-top: 7px;
      margin-bottom: 26px;
    }

    .levelLine {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .xpbar {
      height: 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 999px;
      overflow: hidden;
    }

    #xpfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#7c3aed,#a855f7);
      transition: .3s;
    }

    .xpText {
      text-align: right;
      margin-top: 7px;
      color: #8b949e;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .stat {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 16px;
      border-radius: 18px;
    }

    .label {
      color: #8b949e;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 20px;
      font-weight: bold;
    }

    #map {
      margin-top: 20px;
      width: 100%;
      height: 300px;
      border-radius: 18px;
      border: 1px solid #30363d;
      overflow: hidden;
      background: #080a0d;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #080a0d;
    }

    button:active {
      transform: scale(.98);
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #8b949e;
      font-size: 13px;
      min-height: 20px;
    }

    .session {
      text-align: center;
      margin-top: 10px;
      color: #c9d1d9;
      font-size: 13px;
    }

    .version {
      text-align: center;
      margin-top: 22px;
      color: #484f58;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* Leaflet etwas dunkler darstellen */

    .leaflet-tile-pane {
      filter:
        grayscale(65%)
        brightness(55%)
        contrast(115%);
    }

  </style>
</head>

<body>

<div class="app">

  <div class="topbar">

    <div class="brand">
      RAVEN
    </div>

    <div class="online">
      ● ONLINE
    </div>

  </div>


  <div class="card">

    <div class="raven">
      🐦‍⬛
    </div>

    <h1>
      RAVEN #0001
    </h1>

    <div class="generation">
      Generation 1
    </div>


    <div class="levelLine">

      <span>
        Level <strong id="level">1</strong>
      </span>

      <span>
        Nächstes Level
      </span>

    </div>


    <div class="xpbar">
      <div id="xpfill"></div>
    </div>

    <div class="xpText">
      <span id="xp">0</span> / 100 XP
    </div>


    <div class="stats">

      <div class="stat">

        <div class="label">
          STRECKE
        </div>

        <div class="value">
          <span id="distance">0.00</span> km
        </div>

      </div>


      <div class="stat">

        <div class="label">
          SESSION
        </div>

        <div class="value">
          <span id="sessionDistance">0</span> m
        </div>

      </div>


      <div class="stat">

        <div class="label">
          ALTER
        </div>

        <div class="value">
          Tag 1
        </div>

      </div>


      <div class="stat">

        <div class="label">
          STATUS
        </div>

        <div class="value" id="status">
          Bereit
        </div>

      </div>

    </div>


    <div id="map"></div>


    <button
      id="exploreButton"
      onclick="toggleExploration()"
    >
      Erkundung starten
    </button>


    <div
      class="message"
      id="message"
    >
      Dein Raven wartet auf sein nächstes Abenteuer.
    </div>

  </div>


  <div class="version">
    RAVEN PROTOTYPE V0.3
  </div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let xp =
  Number(localStorage.getItem("ravenXP")) || 0;

let level =
  Number(localStorage.getItem("ravenLevel")) || 1;

let totalDistance =
  Number(localStorage.getItem("ravenDistance")) || 0;


let tracking = false;

let watchId = null;

let lastPosition = null;

let sessionDistance = 0;

let mapCentered = false;

let routePoints = [];


/* -------------------------
   KARTE
------------------------- */

const map =
  L.map("map").setView(
    [51.1657, 10.4515],
    5
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }
).addTo(map);


const positionMarker =
  L.circleMarker(
    [51.1657, 10.4515],
    {
      radius: 8
    }
  );


const routeLine =
  L.polyline(
    [],
    {
      weight: 5,
      opacity: 0.9
    }
  ).addTo(map);


/* -------------------------
   UI
------------------------- */

function updateUI() {

  document.getElementById("xp").textContent =
    xp;

  document.getElementById("level").textContent =
    level;

  document.getElementById("distance").textContent =
    (totalDistance / 1000).toFixed(2);

  document.getElementById("sessionDistance").textContent =
    Math.round(sessionDistance);

  document.getElementById("xpfill").style.width =
    Math.min(xp,100) + "%";
}


/* -------------------------
   XP
------------------------- */

function addXP(amount) {

  xp += amount;

  while (xp >= 100) {

    xp -= 100;

    level++;
  }

  localStorage.setItem(
    "ravenXP",
    xp
  );

  localStorage.setItem(
    "ravenLevel",
    level
  );

  updateUI();
}


/* -------------------------
   ERKUNDUNG
------------------------- */

function toggleExploration() {

  if (tracking) {

    stopExploration();

  } else {

    startExploration();
  }
}


function startExploration() {

  const message =
    document.getElementById("message");

  if (!navigator.geolocation) {

    message.textContent =
      "GPS wird nicht unterstützt.";

    return;
  }


  tracking = true;

  sessionDistance = 0;

  lastPosition = null;

  routePoints = [];

  routeLine.setLatLngs([]);


  document.getElementById("status").textContent =
    "Unterwegs";

  document.getElementById("exploreButton").textContent =
    "Erkundung beenden";

  message.textContent =
    "GPS wird gestartet...";


  watchId =
    navigator.geolocation.watchPosition(

      handlePosition,

      handleGPSError,

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 20000
      }
    );
}


/* -------------------------
   GPS POSITION
------------------------- */

function handlePosition(position) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  if (accuracy > 35) {

    document.getElementById("message").textContent =
      "GPS wird genauer... ±" +
      Math.round(accuracy) +
      " m";

    return;
  }


  const current = {
    lat: lat,
    lon: lon
  };


  /*
     Aktuelle Position
     auf Karte anzeigen
  */

  positionMarker.setLatLng(
    [lat,lon]
  );

  if (!map.hasLayer(positionMarker)) {

    positionMarker.addTo(map);
  }


  /*
     Beim ersten GPS-Fix
     auf Raven zoomen
  */

  if (!mapCentered) {

    map.setView(
      [lat,lon],
      17
    );

    mapCentered = true;
  }


  /*
     Entfernung berechnen
  */

  if (lastPosition) {

    const moved =
      calculateDistance(
        lastPosition.lat,
        lastPosition.lon,
        lat,
        lon
      );


    /*
       Kleine GPS-Sprünge
       und unrealistische Sprünge
       ignorieren
    */

    if (
      moved >= 3 &&
      moved < 150
    ) {

      sessionDistance += moved;

      totalDistance += moved;


      localStorage.setItem(
        "ravenDistance",
        totalDistance
      );


      /*
         Route erweitern
      */

      routePoints.push(
        [lat,lon]
      );

      routeLine.setLatLngs(
        routePoints
      );
    }
  }

  else {

    routePoints.push(
      [lat,lon]
    );

    routeLine.setLatLngs(
      routePoints
    );
  }


  lastPosition = current;


  document.getElementById("message").textContent =
    "Erkundung läuft • GPS ±" +
    Math.round(accuracy) +
    " m";


  updateUI();
}


/* -------------------------
   GPS FEHLER
------------------------- */

function handleGPSError(error) {

  tracking = false;

  document.getElementById("status").textContent =
    "Bereit";

  document.getElementById("exploreButton").textContent =
    "Erkundung starten";


  if (error.code === 1) {

    document.getElementById("message").textContent =
      "Standortzugriff wurde verweigert.";

  }

  else if (error.code === 2) {

    document.getElementById("message").textContent =
      "GPS-Position nicht verfügbar.";

  }

  else {

    document.getElementById("message").textContent =
      "GPS-Zeitüberschreitung.";
  }
}


/* -------------------------
   STOP
------------------------- */

function stopExploration() {

  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );
  }


  watchId = null;

  tracking = false;

  lastPosition = null;


  const earnedXP =
    Math.floor(
      sessionDistance / 10
    );


  if (earnedXP > 0) {

    addXP(
      earnedXP
    );
  }


  document.getElementById("status").textContent =
    "Bereit";

  document.getElementById("exploreButton").textContent =
    "Erkundung starten";


  document.getElementById("message").textContent =
    "Erkundung beendet • " +
    Math.round(sessionDistance) +
    " m • +" +
    earnedXP +
    " XP";


  updateUI();
}


/* -------------------------
   DISTANZ
------------------------- */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const phi1 =
    lat1 * Math.PI / 180;

  const phi2 =
    lat2 * Math.PI / 180;


  const deltaPhi =
    (lat2-lat1) *
    Math.PI / 180;

  const deltaLambda =
    (lon2-lon1) *
    Math.PI / 180;


  const a =

    Math.sin(deltaPhi/2) *
    Math.sin(deltaPhi/2)

    +

    Math.cos(phi1) *
    Math.cos(phi2) *

    Math.sin(deltaLambda/2) *
    Math.sin(deltaLambda/2);


  const c =

    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return R * c;
}


updateUI();

</script>

</body>
</html>
