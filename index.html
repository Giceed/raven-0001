<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAVEN #0001</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1c2430 0%, #0d1117 45%, #050608 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 24px 14px 50px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 13px;
      letter-spacing: 4px;
      color: #8b949e;
    }

    .status {
      font-size: 12px;
      color: #56d364;
    }

    .card {
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid #30363d;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .raven {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      background: linear-gradient(145deg, #242c36, #090b0e);
      border: 1px solid #3b4652;
      box-shadow: inset 0 0 30px rgba(255,255,255,0.03);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .generation {
      text-align: center;
      color: #8b949e;
      margin-top: 7px;
      margin-bottom: 26px;
    }

    .level-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .xpbar {
      width: 100%;
      height: 14px;
      background: #0d1117;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #30363d;
    }

    .xpfill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      transition: width 0.3s ease;
    }

    .xptext {
      margin-top: 7px;
      text-align: right;
      font-size: 12px;
      color: #8b949e;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      background: #0d1117;
      border: 1px solid #30363d;
    }

    .stat .label {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 20px;
      font-weight: bold;
    }

    .map {
      margin-top: 20px;
      height: 175px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #30363d;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        #080a0d;
      background-size: 28px 28px;
      position: relative;
    }

    .map::after {
      content: "NOCH NICHT ERKUNDET";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #484f58;
      font-size: 13px;
      letter-spacing: 2px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #080a0d;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      background: transparent;
      border: 1px solid #30363d;
      color: #c9d1d9;
      margin-top: 10px;
    }

    .message {
      margin-top: 14px;
      text-align: center;
      min-height: 22px;
      font-size: 13px;
      color: #8b949e;
    }

    .version {
      text-align: center;
      margin-top: 22px;
      color: #484f58;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="brand">RAVEN</div>
    <div class="status">● ONLINE</div>
  </div>

  <div class="card">

    <div class="raven">🐦‍⬛</div>

    <h1>RAVEN #0001</h1>
    <div class="generation">Generation 1</div>

    <div class="level-line">
      <span>Level <strong id="level">1</strong></span>
      <span>Nächstes Level</span>
    </div>

    <div class="xpbar">
      <div class="xpfill" id="xpfill"></div>
    </div>

    <div class="xptext">
      <span id="xp">0</span> / 100 XP
    </div>

    <div class="stats">

      <div class="stat">
        <div class="label">STRECKE</div>
        <div class="value"><span id="distance">0.0</span> km</div>
      </div>

      <div class="stat">
        <div class="label">ENTDECKTE GEBIETE</div>
        <div class="value" id="areas">0</div>
      </div>

      <div class="stat">
        <div class="label">ALTER</div>
        <div class="value">Tag 1</div>
      </div>

      <div class="stat">
        <div class="label">STATUS</div>
        <div class="value">Bereit</div>
      </div>

    </div>

    <div class="map"></div>

    <button onclick="startExploration()">
      Erkundung starten
    </button>

    <button class="secondary" onclick="testXP()">
      +10 XP Test
    </button>

    <div class="message" id="message">
      Dein Raven wartet auf sein erstes Abenteuer.
    </div>

  </div>

  <div class="version">
    RAVEN PROTOTYPE V0.1
  </div>

</div>


<script>

  let xp = Number(localStorage.getItem("ravenXP")) || 0;
  let level = Number(localStorage.getItem("ravenLevel")) || 1;

  function updateUI() {

    document.getElementById("xp").textContent = xp;
    document.getElementById("level").textContent = level;

    const percentage = Math.min(xp, 100);

    document.getElementById("xpfill").style.width =
      percentage + "%";

  }

  function testXP() {

    xp += 10;

    if (xp >= 100) {
      xp = xp - 100;
      level++;
    }

    localStorage.setItem("ravenXP", xp);
    localStorage.setItem("ravenLevel", level);

    document.getElementById("message").textContent =
      "+10 XP gesammelt.";

    updateUI();
  }


  function startExploration() {

    const message =
      document.getElementById("message");

    if (!navigator.geolocation) {

      message.textContent =
        "GPS wird von diesem Gerät nicht unterstützt.";

      return;
    }

    message.textContent =
      "Standort wird gesucht...";

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const latitude =
          position.coords.latitude.toFixed(5);

        const longitude =
          position.coords.longitude.toFixed(5);

        message.textContent =
          "Erkundung gestartet ✓ GPS erkannt.";

        console.log(
          "Position:",
          latitude,
          longitude
        );
      },

      function(error) {

        message.textContent =
          "Standort konnte nicht abgerufen werden.";
      },

      {
        enableHighAccuracy: true,
        timeout: 10000
      }
    );
  }


  updateUI();

</script>

</body>
</html>
